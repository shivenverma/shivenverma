name: Update profile contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribution-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: shivenverma

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated contribution art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg"
